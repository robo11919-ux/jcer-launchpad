<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Foundation Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stopColor="#12243A" />
      <stop offset="50%" stopColor="#081321" />
      <stop offset="100%" stopColor="#03070E" />
    </radialGradient>

    <!-- Luxury Multi-Stop 24k Gold Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF7E6" />
      <stop offset="25%" stopColor="#F5D061" />
      <stop offset="50%" stopColor="#E5B869" />
      <stop offset="75%" stopColor="#C48E2E" />
      <stop offset="100%" stopColor="#7A5210" />
    </linearGradient>

    <!-- Metallic Gold Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8A5A12" />
      <stop offset="40%" stopColor="#FFF2D6" />
      <stop offset="70%" stopColor="#E5B869" />
      <stop offset="100%" stopColor="#FFFDF7" />
    </linearGradient>

    <!-- Imperial Crimson Velvet Core Gradient -->
    <radialGradient id="crimsonVelvet" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#A81524" />
      <stop offset="60%" stopColor="#6E0B16" />
      <stop offset="100%" stopColor="#3B0309" />
    </radialGradient>

    <!-- Cyan Ambient Halo -->
    <filter id="ambientHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Depth Shadow -->
    <filter id="crestShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base App Tile Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />

  <!-- Outer Double Gold Filigree Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#gold24k)" stroke-width="4" opacity="0.4" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#goldHighlight)" stroke-width="1.5" opacity="0.75" />

  <!-- Corner Ornamental Accent Dots -->
  <circle cx="56" cy="56" r="4" fill="url(#gold24k)" />
  <circle cx="456" cy="56" r="4" fill="url(#gold24k)" />
  <circle cx="56" cy="456" r="4" fill="url(#gold24k)" />
  <circle cx="456" cy="456" r="4" fill="url(#gold24k)" />

  <!-- Central Ceremonial Shield -->
  <g filter="url(#crestShadow)">
    <!-- Outer Gold Shield Frame -->
    <path
      d="M256 70 L390 130 C390 280, 335 375, 256 425 C177 375, 122 280, 122 130 Z"
      fill="#0A1626"
      stroke="url(#gold24k)"
      stroke-width="8"
      stroke-linejoin="round"
    />

    <!-- Inner Velvet Crimson Inset Shield -->
    <path
      d="M256 86 L374 138 C374 268, 326 352, 256 398 C186 352, 138 268, 138 138 Z"
      fill="url(#crimsonVelvet)"
      stroke="url(#goldHighlight)"
      stroke-width="2.5"
    />
  </g>

  <!-- Golden Laurel Wreath of Honor (Left & Right Branches) -->
  <g fill="url(#gold24k)" opacity="0.95" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.6))">
    <!-- Left Laurel Leaves -->
    <path d="M195 190 C180 185, 172 198, 185 208 C195 204, 198 195, 195 190 Z" />
    <path d="M185 220 C170 216, 163 230, 177 239 C187 234, 190 225, 185 220 Z" />
    <path d="M180 252 C166 250, 160 265, 175 272 C184 266, 186 257, 180 252 Z" />
    <path d="M185 285 C172 285, 169 300, 183 305 C191 298, 192 289, 185 285 Z" />
    <path d="M198 316 C187 319, 187 334, 201 336 C207 328, 206 319, 198 316 Z" />
    <path d="M220 344 C211 349, 214 363, 227 362 C231 354, 228 346, 220 344 Z" />

    <!-- Right Laurel Leaves -->
    <path d="M317 190 C332 185, 340 198, 327 208 C317 204, 314 195, 317 190 Z" />
    <path d="M327 220 C342 216, 349 230, 335 239 C325 234, 322 225, 327 220 Z" />
    <path d="M332 252 C346 250, 352 265, 337 272 C328 266, 326 257, 332 252 Z" />
    <path d="M327 285 C340 285, 343 300, 329 305 C321 298, 320 289, 327 285 Z" />
    <path d="M314 316 C325 319, 325 334, 311 336 C305 328, 306 319, 314 316 Z" />
    <path d="M292 344 C301 349, 298 363, 285 362 C281 354, 284 346, 292 344 Z" />
  </g>

  <!-- Top Imperial 8-Pointed Star of Excellence -->
  <g transform="translate(256, 128)" fill="url(#goldHighlight)" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    <path d="M0 -18 L4 -5 L17 -5 L7 4 L11 17 L0 9 L-11 17 L-7 4 L-17 -5 L-4 -5 Z" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Prominent Central "JCER" Monogram Typography -->
  <text
    x="256"
    y="238"
    font-family="'Times New Roman', 'Cinzel', 'Georgia', serif"
    font-size="62"
    font-weight="bold"
    letter-spacing="5"
    fill="url(#goldHighlight)"
    text-anchor="middle"
    filter="drop-shadow(0 4px 10px rgba(0,0,0,0.95))"
  >JCER</text>

  <!-- Center Gold Divider Ribbon -->
  <g transform="translate(256, 258)">
    <line x1="-70" y1="0" x2="70" y2="0" stroke="url(#gold24k)" stroke-width="2" />
    <circle cx="0" cy="0" r="4.5" fill="url(#goldHighlight)" />
    <polygon points="-6,0 0,-3 6,0 0,3" fill="#FFFFFF" />
  </g>

  <!-- Ceremonial "ERP LAUNCH" Sub-Title -->
  <text
    x="256"
    y="288"
    font-family="'Manrope', system-ui, sans-serif"
    font-size="19"
    font-weight="900"
    letter-spacing="6"
    fill="#FFF4D4"
    text-anchor="middle"
    opacity="0.95"
    filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))"
  >ERP LAUNCH</text>

  <!-- Bottom Golden Key Ribbon Emblem -->
  <g transform="translate(256, 328) scale(1.1)" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.7))">
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#gold24k)" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#0E1B2C" />
    <path d="M0 10 L0 24 M-4 17 L0 17 M-4 22 L0 22" stroke="url(#gold24k)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Institutional Belagavi Banner at Bottom Base -->
  <text
    x="256"
    y="464"
    font-family="'Manrope', system-ui, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="7"
    fill="#D4AF37"
    text-anchor="middle"
    opacity="0.9"
  >BELAGAVI</text>
</svg>
