<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#132338" />
      <stop offset="60%" stopColor="#0A1524" />
      <stop offset="100%" stopColor="#040810" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2D6" />
      <stop offset="35%" stopColor="#E5B869" />
      <stop offset="70%" stopColor="#C48E2E" />
      <stop offset="100%" stopColor="#8A5A12" />
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8A5A12" />
      <stop offset="50%" stopColor="#FFF2D6" />
      <stop offset="100%" stopColor="#C48E2E" />
    </linearGradient>

    <!-- Crimson Launch Core Gradient -->
    <radialGradient id="redLaunch" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#FF4D55" />
      <stop offset="50%" stopColor="#E31B23" />
      <stop offset="100%" stopColor="#66050A" />
    </radialGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Base Solid Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Metallic Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#goldRim)" stroke-width="6" opacity="0.65" />

  <!-- Inner Cyan Tech Orbit Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="14 10" opacity="0.75" filter="url(#cyanGlow)" />

  <!-- Center Metallic Outer Shield -->
  <circle cx="256" cy="256" r="140" fill="#0E1E30" stroke="url(#goldLinear)" stroke-width="8" filter="url(#dropShadow)" />

  <!-- 3D Crimson Core Button Target -->
  <circle cx="256" cy="256" r="105" fill="url(#redLaunch)" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" />

  <!-- Center Golden Launch Rocket Emblem -->
  <g transform="translate(256, 256) scale(1.6) translate(-24, -24)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.7))">
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" fill="url(#goldLinear)" />
    <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" fill="url(#goldLinear)" stroke="#FFF2D6" stroke-width="1.5" />
    <path d="M9 12H4s.55-3.03 2-4.5c1.45-1.47 4.5-2 4.5-2" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M15 9V4s3.03.55 4.5 2c1.47 1.45 2 4.5 2 4.5" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="15" cy="9" r="2" fill="#07111F" />
  </g>

  <!-- Top Institutional Monogram -->
  <text x="256" y="98" font-family="'Manrope', system-ui, sans-serif" font-size="24" font-weight="900" fill="#E5B869" text-anchor="middle" letter-spacing="8" opacity="0.95">JCER BELAGAVI</text>

  <!-- Bottom Subtitle -->
  <text x="256" y="440" font-family="'Manrope', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFF2D6" text-anchor="middle" letter-spacing="6" opacity="0.85">LAUNCH CONTROLLER</text>
</svg>
